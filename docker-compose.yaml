services:
  backend_service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    container_name: backend
    depends_on:
      database_service:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - local

  database_service:
    image: postgres:16
    container_name: backend_database
    ports:
      - "5435:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - local
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 1s
      timeout: 1s
      retries: 60
volumes:
  pg_data:

networks:
  local: