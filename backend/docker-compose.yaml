services:
  backend_service:
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "8000:8000"
    container_name: backend
    depends_on:
      database_service:
        condition: service_healthy
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ovi
      POSTGRES_HOST: database_service
      POSTGRES_PORT: 5432
    networks:
      - local

  database_service:
    image: postgres:16
    container_name: backend_database
    ports:
      - "5435:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ovi
      POSTGRES_HOST: database_service
      POSTGRES_PORT: 5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 1s
      timeout: 1s
      retries: 60
volumes:
  pg_data:

networks:
  local: